<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — PWA Brasil (PT-BR)</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fff; color: #1a1c1e; text-align: center; padding: 1rem; }
    h1 { color: #0b57d0; }
    button { font: inherit; padding: .7rem 1.2rem; border: 0; border-radius: .6rem; background: #0b57d0; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Você está offline</h1>
    <p>Esta página ainda não foi guardada no cache. Conecte-se e tente novamente.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
